# Untrusted developer-branch diagnostics. Not the protected CI policy.
# This workflow is source-controlled on feature branches and MUST NOT grant
# task completion, reviewer approval, release, finalization, or provider writes.
name: Orchestrator branch validation

on:
  push:
    branches:
      - 'codex/orchestrator-*'

permissions:
  contents: read

concurrency:
  group: orchestrator-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-suite:
    name: offline / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Checkout exactly the pushed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (immutable Git commit)
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install selected Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (immutable Git commit)
        with:
          python-version: ${{ matrix.python }}
      - name: Install developer dependencies
        shell: bash
        run: python -m pip install -e '.[dev]'
      # Read-only lint investigation: the proposal is never applied in CI.
      # This diagnostic cannot override the strict lint gate below.
      - name: Ruff inventory and safe-fix diff (diagnostic only)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        shell: bash
        run: |
          python -m ruff check src/ tests/ --output-format concise || true
          python -m ruff check src/ tests/ --fix --diff || true
      - name: Full non-E2E verification against pushed Git SHA
        shell: bash
        env:
          REVIEWED_HEAD_SHA: ${{ github.sha }}
          W2A_E2E_RUN: '0'
        # Native Windows pin/close and process-recovery tests can exceed the
        # verifier's default 600 seconds. Match the documented local budget;
        # retain the same complete suite, strict lint and exact-SHA checks.
        run: python scripts/verify_orchestrator.py --full --strict --diagnostics --expected-sha "$REVIEWED_HEAD_SHA" --timeout 1200

  package-build:
    name: package build (diagnostic)
    needs: offline-suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Install and smoke-test the built wheel
        run: |
          python -m pip install dist/*.whl
          chatgpt-web2api --help
          chatgpt-web2api-mcp --help
