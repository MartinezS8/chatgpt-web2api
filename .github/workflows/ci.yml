name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  offline-suite:
    name: strict offline / Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install developer dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e '.[dev]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full non-E2E verification against exact Git SHA
        shell: pwsh
        env:
          REVIEWED_HEAD_SHA: ${{ github.sha }}
          W2A_E2E_RUN: '0'
        run: |
          if ($env:REVIEWED_HEAD_SHA -notmatch '^[0-9a-f]{40}$') { throw 'GitHub did not provide an exact commit SHA.' }
          python scripts/verify_orchestrator.py --full --strict --diagnostics --expected-sha $env:REVIEWED_HEAD_SHA --timeout 1200
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  secret-scan:
    name: full-history Gitleaks scan / Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run verified Gitleaks release
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/scripts/scan_secrets_windows.ps1" -SourcePath $env:GITHUB_WORKSPACE

  build:
    name: Windows wheel build and installed CLI smokes / Python 3.12
    needs: [offline-suite, secret-scan]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build wheel and source distribution outside the checkout
        shell: pwsh
        run: |
          $distDirectory = Join-Path $env:RUNNER_TEMP 'w2a-dist'
          New-Item -ItemType Directory -Path $distDirectory -Force | Out-Null
          python -m pip install --upgrade pip build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m build --sdist --wheel --outdir $distDirectory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem -LiteralPath $distDirectory -Filter '*.whl' -File)
          $sdists = @(Get-ChildItem -LiteralPath $distDirectory -Filter '*.tar.gz' -File)
          if ($wheels.Count -ne 1 -or $sdists.Count -ne 1) { throw 'Expected exactly one wheel and one source distribution.' }
      - name: Install wheel into a fresh Python 3.12 environment and smoke CLIs
        shell: pwsh
        run: |
          $smokeVenv = Join-Path $env:RUNNER_TEMP 'w2a-wheel-smoke'
          python -m venv $smokeVenv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheelPython = Join-Path $smokeVenv 'Scripts/python.exe'
          $wheel = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'w2a-dist') -Filter '*.whl' -File)
          if ($wheel.Count -ne 1) { throw 'Expected exactly one wheel from the external build directory.' }
          & $wheelPython -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $wheelPython -m pip install $wheel[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $commands = @(
            'chatgpt-web2api.exe',
            'chatgpt-web2api-mcp.exe',
            'chatgpt-orchestrator-observer-mcp.exe'
          )
          foreach ($command in $commands) {
            $commandPath = Join-Path $smokeVenv "Scripts/$command"
            if (-not (Test-Path -LiteralPath $commandPath -PathType Leaf)) { throw "Installed command is missing: $command" }
            & $commandPath --help
            if ($LASTEXITCODE -ne 0) { throw "Installed command help failed: $command" }
          }
          & $wheelPython -m chatgpt_web2api.orchestrator --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed orchestrator module help failed.' }
          & $wheelPython -m chatgpt_web2api.orchestrator capabilities
          if ($LASTEXITCODE -ne 0) { throw 'Installed orchestrator capabilities smoke failed.' }
